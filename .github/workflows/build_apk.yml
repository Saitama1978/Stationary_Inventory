name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter Native Platform Files
        run: flutter create --platforms=android --project-name stationery_inventory --no-pub .

      - name: Inject Android SDK 36 Configurations
        run: |
          # 1. Force compileSdk in app build.gradle.kts / build.gradle
          find android -name "build.gradle.kts" -exec sed -i 's/compileSdk =.*/compileSdk = 36/g' {} +
          find android -name "build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +

          # 2. Append subprojects override using legacy-compatible script block
          cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      val android = project.extensions.findByName("android") as? com.android.build.gradle.BaseExtension
                      android?.compileSdkVersion(36)
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationery-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
