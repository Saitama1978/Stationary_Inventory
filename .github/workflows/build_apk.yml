name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter Native Platform Files
        run: flutter create --platforms=android --project-name stationery_inventory --no-pub .

      - name: Force compileSdk 36 on all plugins
        run: |
          python3 -c '
          import os

          # Inject subprojects compileSdk override in build.gradle
          gradle_files = []
          for root, dirs, files in os.walk("android"):
              for file in files:
                  if file in ["build.gradle", "build.gradle.kts"]:
                      gradle_files.append(os.path.join(root, file))

          override_code = """
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion = 36
                      }
                  }
              }
          }
          """

          root_gradle = "android/build.gradle"
          if os.path.exists("android/build.gradle.kts"):
              root_gradle = "android/build.gradle.kts"
              override_code = """
              subprojects {
                  afterEvaluate {
                      val android = extensions.findByName("android") as? com.android.build.gradle.BaseExtension
                      android?.compileSdkVersion(36)
                  }
              }
              """

          if os.path.exists(root_gradle):
              with open(root_gradle, "a") as f:
                  f.write(override_code)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationery-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
