name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter Native Platform Files
        run: flutter create --platforms=android --project-name stationery_inventory --offline .

      - name: Force Android SDK Version 36
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/compileSdk =.*/compileSdk = 36/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' {} +

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationery-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
