:name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter Native Platform Files
        run: flutter create --platforms=android --project-name stationery_inventory --no-pub .

      - name: Configure compileSdk in build.gradle.kts
        run: |
          python3 -c '
          import os

          # Inject compileSdk override block for Kotlin DSL build.gradle.kts
          override_code = """

          subprojects {
              plugins.withId("com.android.application") {
                  val android = extensions.getByType(com.android.build.gradle.AppExtension::class.java)
                  android.compileSdkVersion(36)
              }
              plugins.withId("com.android.library") {
                  val android = extensions.getByType(com.android.build.gradle.LibraryExtension::class.java)
                  android.compileSdkVersion(36)
              }
          }
          """

          file_path = "android/build.gradle.kts"
          if os.path.exists(file_path):
              with open(file_path, "a") as f:
                  f.write(override_code)
          elif os.path.exists("android/build.gradle"):
              groovy_code = """
              subprojects {
                  plugins.withId("com.android.application") {
                      android { compileSdkVersion 36 }
                  }
                  plugins.withId("com.android.library") {
                      android { compileSdkVersion 36 }
                  }
              }
              """
              with open("android/build.gradle", "a") as f:
                  f.write(groovy_code)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationery-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  
