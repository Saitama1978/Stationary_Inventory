name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Flutter Native Platform Files
        run: flutter create --platforms=android --project-name stationery_inventory --no-pub .

      - name: Force compileSdk 36 across all subprojects
        run: |
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              val updateSdk = {
                  val android = extensions.findByName("android") as? com.android.build.gradle.BaseExtension
                  android?.compileSdkVersion(36)
              }
              if (state.executed) {
                  updateSdk()
              } else {
                  afterEvaluate {
                      updateSdk()
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationery-inventory-apk
          path: build/app/outputs/flutter-apk/app-release.apk
